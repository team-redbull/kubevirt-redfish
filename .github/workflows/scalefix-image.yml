name: scalefix image

# Builds the patched controller with the repo's own Dockerfile and pushes it to
# ghcr.io/<owner>/kubevirt-redfish. Fork-only: not part of any upstream PR.
on:
  push:
    branches: [main, kubevirt-1.8-tp-scalefix]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> :main-scalefix, kubevirt-1.8-tp-scalefix -> :v4.22-scalefix;
      # every build also gets an immutable :sha-<commit> tag.
      - id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "name=main-scalefix" >> "$GITHUB_OUTPUT"
          else
            echo "name=v4.22-scalefix" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubevirt-redfish:${{ steps.tag.outputs.name }}
            ghcr.io/${{ github.repository_owner }}/kubevirt-redfish:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=kubevirt-redfish (${{ github.ref_name }}) + client-go rate-limit, VM/VMI cache and worker-pool patches
