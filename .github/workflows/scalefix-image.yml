name: scalefix image

# Builds the patched controller with the repo's own Dockerfile and pushes it to
# ghcr.io/<owner>/kubevirt-redfish. Fork-only: not part of any upstream PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :main-scalefix follows main; :sha-<commit> is immutable, mirror that one.
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubevirt-redfish:main-scalefix
            ghcr.io/${{ github.repository_owner }}/kubevirt-redfish:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=kubevirt-redfish (${{ github.ref_name }}) + upstream PRs #29-#33 (worker stop, client-go rate limit, worker pool, VM/VMI cache, VM write race) and #36-#39 (insert/power-on race, power-off not deferred, image URL redacted, failed import)
